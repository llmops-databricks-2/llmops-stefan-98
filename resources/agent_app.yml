resources:
  apps:
    notubiz_agent_app:
      name: agent-notubiz-${bundle.target}
      description: Notubiz document agent with Lakebase pgvector retrieval
      source_code_path: ../
      usage_policy_id: ${var.usage_policy_id}
      permissions:
        - service_principal_name: ${var.agent_service_principal_id}
          level: CAN_USE
      config:
        command: ["uv", "run", "start-server"]
        env:
          - name: ENV
            value: ${bundle.target}
          - name: GENIE_SPACE_ID
            value: ${resources.genie_spaces.notubiz-space.id}
