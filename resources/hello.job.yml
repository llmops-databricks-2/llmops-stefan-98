# The hello-world job: one serverless notebook task that installs your arxiv_curator wheel,
# loads project_config.yml and writes one row to the hello table in your schema of the target's
# catalog (dev: llmops_dev.stefan_98).
# It runs as whoever deploys the bundle; the target's deploy principal does that from GitHub
# Actions. Its name ends with the target, so the three deployments never collide. The course's
# onboarding gives you CAN_MANAGE on the dev job and CAN_VIEW on the acc and prd jobs once they are
# deployed, so this public file names nobody.
resources:
  jobs:
    hello:
      name: job-hello-stefan-98-${bundle.target}
      budget_policy_id: "4e4dddd7-4129-322f-9c85-3f7053f06f8b"
      environments:
        - environment_key: default
          spec:
            environment_version: "6"
            dependencies:
              - ../dist/*.whl

      tasks:
        - task_key: hello
          environment_key: default
          notebook_task:
            notebook_path: deployment_notebooks/hello.py
            base_parameters:
              env: ${bundle.target}
