resources:
  jobs:
    notubiz_lakebase_sync:
      name: notubiz-lakebase-sync-${bundle.target}
      budget_policy_id: "4e4dddd7-4129-322f-9c85-3f7053f06f8b"
      timeout_seconds: 7200
      max_concurrent_runs: 1
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ../dist/*.whl
      tasks:
        - task_key: sync_chunks
          environment_key: default
          python_wheel_task:
            package_name: notubiz-curator
            entry_point: notubiz_lakebase_sync
            parameters:
              - --environment
              - ${bundle.target}
              - --config-path
              - ${workspace.file_path}/project_config.yml
