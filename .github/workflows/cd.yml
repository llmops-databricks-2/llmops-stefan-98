name: CD

on:
  # Keep CD manual-only while testing; enable push to main when ready for automatic releases.
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

concurrency:
  group: databricks-release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  acc:
    uses: ./.github/workflows/deploy-environment.yml
    with:
      target: acc

  prd:
    needs: acc
    uses: ./.github/workflows/deploy-environment.yml
    with:
      target: prd
